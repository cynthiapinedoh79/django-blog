{% extends 'blog/base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<article>
    <h2>{{ post.title }}</h2>
    <div class="post-meta">
        By {{ post.author }} | {{ post.created_on|date:"F d, Y" }}
    </div>
    <div class="post-content" style="margin-top: 20px;">
        {{ post.content|linebreaks }}
    </div>
</article>

<div style="margin-top: 30px;">
    <a href="{% url 'blog:post_list' %}">← Back to all posts</a>
</div>
{% endblock %}
