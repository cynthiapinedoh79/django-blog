{% extends 'blog/base.html' %}

{% block title %}{{ action }} Post{% endblock %}

{% block content %}
    <h2>{{ action }} Post</h2>

    <form method="post">
        {% csrf_token %}
        
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ post.title }}" required>
        
        <label for="content">Content:</label>
        <textarea id="content" name="content" required>{{ post.content }}</textarea>
        
        <label>
            <input type="checkbox" name="published" {% if post.published %}checked{% endif %}>
            Published
        </label>
        
        <div style="margin-top: 20px;">
            <button type="submit">{{ action }} Post</button>
            <a href="{% if post %}{% url 'post_detail' post.pk %}{% else %}{% url 'post_list' %}{% endif %}" class="btn" style="background: #6c757d;">Cancel</a>
        </div>
    </form>
{% endblock %}
