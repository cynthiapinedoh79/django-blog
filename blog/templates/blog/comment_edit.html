{% extends 'blog/base.html' %}

{% block title %}Edit Comment - Django Blog{% endblock %}

{% block content %}
<h2>Edit Comment</h2>

<div style="background: #f9f9f9; padding: 15px; margin: 20px 0; border-radius: 4px;">
    <p><strong>Post:</strong> {{ comment.post.title }}</p>
    <p><strong>Original comment posted:</strong> {{ comment.created_at|date:"F d, Y H:i" }}</p>
</div>

<form method="post" style="margin-top: 20px;">
    {% csrf_token %}
    <div style="margin-bottom: 15px;">
        {{ form.content }}
    </div>
    <button type="submit" class="btn">Save Changes</button>
    <a href="{% url 'post_detail' comment.post.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
