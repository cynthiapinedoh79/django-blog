<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
</head>
<body>
    <h1>About Page</h1>
    {% if about %}
        <h2>{{ about.title }}</h2>
        <p>{{ about.content|linebreaks }}</p>
        <p><em>Last updated: {{ about.updated_on }}</em></p>
    {% else %}
        <p>No content available yet. Please add content from the admin panel.</p>
    {% endif %}
</body>
</html>
